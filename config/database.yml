# PostgreSQL configuration.
#
# Connection is driven entirely by environment variables so the SAME file
# works for local development and for the Docker Compose setup used by
# evaluators — no manual editing/commenting required:
#
#   Local dev (no env vars set): host/port/username/password are all nil,
#     so the pg gem connects over the unix domain socket using the OS
#     user's Postgres role. This machine's local Postgres requires a
#     password for any TCP connection but has passwordless peer auth
#     configured on the socket, so this is the zero-config path.
#
#   Docker (see docker-compose.yml): export DB_HOST=localhost DB_PORT=5433
#     DB_USERNAME=bus_booking DB_PASSWORD=password before running rails
#     commands — see README "Docker Setup" for the exact export line.
#     This forces a TCP connection to the containerized Postgres instead
#     of the local socket.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV["DB_HOST"] %>
  port: <%= ENV["DB_PORT"] %>
  username: <%= ENV["DB_USERNAME"] %>
  password: <%= ENV["DB_PASSWORD"] %>

development:
  <<: *default
  database: bus_booking_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: bus_booking_test

production:
  <<: *default
  database: bus_booking_production
  username: bus_booking
  password: <%= ENV["BUS_BOOKING_DATABASE_PASSWORD"] %>
